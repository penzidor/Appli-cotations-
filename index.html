<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éditeur de Fiche Technique & Cotes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col select-none overflow-hidden font-sans">

    <!-- Barre d'outils principale (Haut) -->
    <div class="bg-white shadow-sm border-b border-slate-200 p-3 flex flex-wrap gap-4 items-center justify-between z-20 relative">
        <label class="flex items-center gap-2 px-3 py-2 bg-slate-800 text-white rounded cursor-pointer hover:bg-slate-700 transition shadow-sm text-sm font-medium">
            <i class="fa-solid fa-upload"></i>
            <span id="upload-text">Importer image</span>
            <input type="file" id="image-upload" accept="image/*" class="hidden">
        </label>

        <div id="tools-mode" class="hidden flex bg-slate-100 p-1 rounded border border-slate-200 shadow-inner">
            <button id="btn-draw" onclick="setMode('draw')" class="flex items-center gap-2 px-4 py-2 rounded transition-all font-bold text-sm bg-blue-600 text-white shadow-md">
                <i class="fa-solid fa-pencil"></i> Tracer
            </button>
            <button id="btn-select" onclick="setMode('select')" class="flex items-center gap-2 px-4 py-2 rounded transition-all font-bold text-sm text-slate-600 hover:bg-slate-200">
                <i class="fa-solid fa-mouse-pointer"></i> Sélectionner / Déplacer
            </button>
        </div>

        <div id="tools-right" class="hidden flex items-center gap-3">
            <div class="flex items-center bg-slate-100 rounded border border-slate-200 shadow-inner text-slate-600 text-xs font-bold gap-1">
                <button onclick="zoomBy(-0.25)" class="p-2 hover:bg-slate-200 rounded-l" title="Dézoomer"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                <span id="zoom-level" class="w-12 text-center">100%</span>
                <button onclick="zoomBy(0.25)" class="p-2 hover:bg-slate-200 rounded-r" title="Zoomer"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
            </div>
            <button onclick="togglePreview()" id="btn-preview" class="flex items-center gap-2 px-3 py-2 rounded text-sm font-bold transition shadow-sm bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100">
                <i class="fa-solid fa-camera"></i> Rendu Final
            </button>
        </div>
    </div>

    <!-- Barre d'options de la flèche sélectionnée -->
    <div id="arrow-options" class="hidden bg-slate-800 text-white p-2.5 flex flex-wrap justify-center items-center gap-3 z-30 relative shadow-lg">
        <span class="text-slate-300 text-sm font-medium mr-1">Action :</span>
        <button onclick="setEditAction('move')" id="act-move" class="flex items-center gap-1 px-2.5 py-1.5 rounded text-xs font-medium bg-orange-500 text-white shadow"><i class="fa-solid fa-hand"></i> Déplacer</button>
        <button onclick="setEditAction('resize')" id="act-resize" class="flex items-center gap-1 px-2.5 py-1.5 rounded text-xs font-medium bg-slate-700 hover:bg-slate-600"><i class="fa-solid fa-expand"></i> Taille flèche</button>
        <button onclick="setEditAction('rotate')" id="act-rotate" class="flex items-center gap-1 px-2.5 py-1.5 rounded text-xs font-medium bg-slate-700 hover:bg-slate-600"><i class="fa-solid fa-rotate"></i> Pivoter</button>
        
        <div class="w-px h-5 bg-slate-600 mx-1"></div>
        <div class="flex items-center gap-1.5 bg-slate-700 px-2 py-1 rounded" title="Épaisseur de la flèche">
            <span class="text-slate-300 text-xs">Flèche :</span>
            <input type="range" id="range-size" min="0.2" max="3" step="0.1" value="1" oninput="updateArrowSize(this.value)" class="w-16 accent-orange-500">
        </div>
        <div class="flex items-center gap-1.5 bg-slate-700 px-2 py-1 rounded" title="Taille de l'intitulé (texte)">
            <i class="fa-solid fa-font text-slate-300 text-xs"></i>
            <span class="text-slate-300 text-xs">Texte :</span>
            <input type="range" id="range-text-size" min="0.5" max="3" step="0.1" value="1" oninput="updateTextSize(this.value)" class="w-16 accent-orange-500">
        </div>

        <div class="w-px h-5 bg-slate-600 mx-1"></div>
        <button onclick="snap('horiz')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs transition">Horiz.</button>
        <button onclick="snap('vert')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs transition">Vertic.</button>
    </div>

    <!-- Zone de travail & Scroll -->
    <div id="workspace" class="flex-1 overflow-auto bg-slate-200 p-4 relative flex justify-center items-start">
        <div id="welcome-msg" class="mt-20 flex flex-col items-center opacity-50">
            <i class="fa-solid fa-cloud-arrow-up text-6xl mb-4"></i>
            <p>Veuillez importer une image.</p>
        </div>

        <div id="canvas-container" class="hidden relative shadow-2xl bg-white border border-slate-300">
            <img id="main-image" class="block max-w-[90vw] md:max-w-[80vw] object-contain pointer-events-none" alt="Support">
            
            <svg id="svg-layer" class="absolute top-0 left-0 w-full h-full overflow-visible">
                <defs>
                    <marker id="arrow-start" orient="auto" markerWidth="5" markerHeight="5" refX="0.5" refY="2.5"><path d="M 5 0 L 0 2.5 L 5 5 Z" fill="#0284c7" /></marker>
                    <marker id="arrow-end" orient="auto" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5"><path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#0284c7" /></marker>
                    <marker id="arrow-start-sel" orient="auto" markerWidth="5" markerHeight="5" refX="0.5" refY="2.5"><path d="M 5 0 L 0 2.5 L 5 5 Z" fill="#ea580c" /></marker>
                    <marker id="arrow-end-sel" orient="auto" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5"><path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#ea580c" /></marker>
                </defs>
            </svg>

            <div id="html-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none"></div>
        </div>
    </div>

    <script>
        let imageLoaded = false;
        let arrows = [];
        let mode = 'draw'; // 'draw' | 'select' | 'preview'
        let selectedId = null;
        let editAction = 'move'; // 'move' | 'resize' | 'rotate'
        let scale = 1;
        let dragState = null;

        const canvasContainer = document.getElementById('canvas-container');
        const mainImage = document.getElementById('main-image');
        const svgLayer = document.getElementById('svg-layer');
        const htmlLayer = document.getElementById('html-layer');

        // Gestion de l'upload d'image
        document.getElementById('image-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                mainImage.src = URL.createObjectURL(file);
                mainImage.onload = () => {
                    imageLoaded = true;
                    document.getElementById('welcome-msg').classList.add('hidden');
                    canvasContainer.classList.remove('hidden');
                    document.getElementById('tools-mode').classList.remove('hidden');
                    document.getElementById('tools-right').classList.remove('hidden');
                    document.getElementById('upload-text').innerText = 'Changer Image';
                    arrows = [];
                    selectedId = null;
                    scale = 1;
                    updateView();
                };
            }
        });

        function setMode(newMode) {
            mode = newMode;
            selectedId = null;
            document.getElementById('btn-draw').className = mode === 'draw' ? 'flex items-center gap-2 px-4 py-2 rounded transition-all font-bold text-sm bg-blue-600 text-white shadow-md' : 'flex items-center gap-2 px-4 py-2 rounded transition-all font-bold text-sm text-slate-600 hover:bg-slate-200';
            document.getElementById('btn-select').className = mode === 'select' ? 'flex items-center gap-2 px-4 py-2 rounded transition-all font-bold text-sm bg-blue-600 text-white shadow-md' : 'flex items-center gap-2 px-4 py-2 rounded transition-all font-bold text-sm text-slate-600 hover:bg-slate-200';
            canvasContainer.style.cursor = mode === 'draw' ? 'crosshair' : 'default';
            updateView();
        }

        function setEditAction(act) {
            editAction = act;
            ['move', 'resize', 'rotate'].forEach(a => {
                const btn = document.getElementById(`act-${a}`);
                btn.className = a === act ? 'flex items-center gap-1 px-2.5 py-1.5 rounded text-xs font-medium bg-orange-500 text-white shadow' : 'flex items-center gap-1 px-2.5 py-1.5 rounded text-xs font-medium bg-slate-700 hover:bg-slate-600';
            });
            updateView();
        }

        function zoomBy(delta) {
            scale = Math.min(Math.max(scale + delta, 0.25), 5);
            updateView();
        }

        function togglePreview() {
            if (mode === 'preview') {
                mode = 'select';
                document.getElementById('btn-preview').className = "flex items-center gap-2 px-3 py-2 rounded text-sm font-bold transition shadow-sm bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100";
            } else {
                mode = 'preview';
                selectedId = null;
                document.getElementById('btn-preview').className = "flex items-center gap-2 px-3 py-2 rounded text-sm font-bold transition shadow-sm bg-emerald-600 text-white";
            }
            updateView();
        }

        function getCoords(e) {
            const rect = mainImage.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) / scale,
                y: (e.clientY - rect.top) / scale
            };
        }

        // Dessin et interactions pointeur
        canvasContainer.addEventListener('pointerdown', (e) => {
            if (!imageLoaded || mode === 'preview') return;
            const coords = getCoords(e);

            if (mode === 'draw') {
                dragState = { type: 'draw', x1: coords.x, y1: coords.y, x2: coords.x, y2: coords.y };
                selectedId = null;
            } else if (mode === 'select' && e.target === mainImage) {
                selectedId = null;
                updateView();
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (!dragState) return;
            const coords = getCoords(e);

            if (dragState.type === 'draw') {
                dragState.x2 = coords.x;
                dragState.y2 = coords.y;
                updateView();
            } else if (dragState.type === 'move_body') {
                const arr = arrows.find(a => a.id === dragState.id);
                if (arr) {
                    const dx = coords.x - dragState.lastX;
                    const dy = coords.y - dragState.lastY;
                    arr.x1 += dx; arr.y1 += dy;
                    arr.x2 += dx; arr.y2 += dy;
                    dragState.lastX = coords.x; dragState.lastY = coords.y;
                    updateView();
                }
            } else if (dragState.type === 'resize') {
                const arr = arrows.find(a => a.id === dragState.id);
                if (arr) {
                    if (dragState.which === 'start') { arr.x1 = coords.x; arr.y1 = coords.y; }
                    else { arr.x2 = coords.x; arr.y2 = coords.y; }
                    updateView();
                }
            } else if (dragState.type === 'rotate') {
                const arr = arrows.find(a => a.id === dragState.id);
                if (arr) {
                    const cx = (arr.x1 + arr.x2) / 2;
                    const cy = (arr.y1 + arr.y2) / 2;
                    const curAngle = Math.atan2(coords.y - cy, coords.x - cx);
                    const delta = curAngle - dragState.lastAngle;
                    const cos = Math.cos(delta), sin = Math.sin(delta);
                    
                    const nx1 = cx + (arr.x1 - cx) * cos - (arr.y1 - cy) * sin;
                    const ny1 = cy + (arr.x1 - cx) * sin + (arr.y1 - cy) * cos;
                    const nx2 = cx + (arr.x2 - cx) * cos - (arr.y2 - cy) * sin;
                    const ny2 = cy + (arr.x2 - cx) * sin + (arr.y2 - cy) * cos;
                    
                    arr.x1 = nx1; arr.y1 = ny1; arr.x2 = nx2; arr.y2 = ny2;
                    dragState.lastAngle = curAngle;
                    updateView();
                }
            }
        });

        window.addEventListener('pointerup', () => {
            if (!dragState) return;
            if (dragState.type === 'draw') {
                const dist = Math.hypot(dragState.x2 - dragState.x1, dragState.y2 - dragState.y1);
                if (dist > 5) {
                    const newArrow = { id: Date.now(), x1: dragState.x1, y1: dragState.y1, x2: dragState.x2, y2: dragState.y2, label: 'X', size: 1, textSize: 1 };
                    arrows.push(newArrow);
                    selectedId = newArrow.id;
                    setMode('select');
                    setEditAction('move');
                }
            }
            dragState = null;
            updateView();
        });

        function updateArrowSize(val) {
            const arr = arrows.find(a => a.id === selectedId);
            if (arr) { arr.size = parseFloat(val); updateView(); }
        }

        function updateTextSize(val) {
            const arr = arrows.find(a => a.id === selectedId);
            if (arr) { arr.textSize = parseFloat(val); updateView(); }
        }

        function snap(type) {
            const arr = arrows.find(a => a.id === selectedId);
            if (!arr) return;
            const cx = (arr.x1 + arr.x2) / 2;
            const cy = (arr.y1 + arr.y2) / 2;
            const len = Math.hypot(arr.x2 - arr.x1, arr.y2 - arr.y1);
            if (type === 'horiz') {
                arr.x1 = cx - len/2; arr.y1 = cy; arr.x2 = cx + len/2; arr.y2 = cy;
            } else {
                arr.x1 = cx; arr.y1 = cy - len/2; arr.x2 = cx; arr.y2 = cy + len/2;
            }
            updateView();
        }

        // Mise à jour de l'affichage graphique
        function updateView() {
            canvasContainer.style.transform = `scale(${scale})`;
            canvasContainer.style.transformOrigin = 'top left';
            document.getElementById('zoom-level').innerText = Math.round(scale * 100) + '%';

            // Rendu SVG (Flèches)
            let svgContent = svgLayer.querySelector('defs').outerHTML;
            arrows.forEach(arr => {
                const isSel = (arr.id === selectedId && mode !== 'preview');
                const color = isSel ? '#ea580c' : '#0284c7';
                const marker = isSel ? '-sel' : '';
                const strokeW = (isSel ? 1.5 : 1) * (arr.size || 1);
                
                svgContent += `<line x1="${arr.x1}" y1="${arr.y1}" x2="${arr.x2}" y2="${arr.y2}" stroke="${color}" stroke-width="${strokeW}" marker-start="url(#arrow-start${marker})" marker-end="url(#arrow-end${marker})" />`;
                
                if (isSel && editAction === 'resize') {
                    svgContent += `<circle cx="${arr.x1}" cy="${arr.y1}" r="6" fill="white" stroke="#ea580c" stroke-width="2" style="cursor:pointer;" onpointerdown="event.stopPropagation(); dragState = {type:'resize', id:${arr.id}, which:'start'};" />`;
                    svgContent += `<circle cx="${arr.x2}" cy="${arr.y2}" r="6" fill="white" stroke="#ea580c" stroke-width="2" style="cursor:pointer;" onpointerdown="event.stopPropagation(); dragState = {type:'resize', id:${arr.id}, which:'end'};" />`;
                }
            });

            if (dragState && dragState.type === 'draw') {
                svgContent += `<line x1="${dragState.x1}" y1="${dragState.y1}" x2="${dragState.x2}" y2="${dragState.y2}" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />`;
            }
            svgLayer.innerHTML = svgContent;

            // Rendu HTML (Textes et bulles d'édition)
            let htmlContent = '';
            arrows.forEach(arr => {
                const isSel = (arr.id === selectedId && mode !== 'preview');
                const midX = (arr.x1 + arr.x2) / 2;
                const midY = (arr.y1 + arr.y2) / 2;
                const textScale = arr.textSize || 1;

                htmlContent += `
                    <div style="position: absolute; left: ${midX}px; top: ${midY}px; transform: translate(-50%, -50%) scale(${textScale}); pointer-events: auto;">
                        <div class="relative flex items-center px-1 rounded shadow-sm ${isSel ? 'ring-2 ring-orange-500 bg-white' : 'bg-white/90 hover:bg-white'}" 
                             style="cursor: pointer;"
                             onpointerdown="event.stopPropagation(); selectedId = ${arr.id}; updateView(); if('${mode}'==='select') { if('${editAction}'==='move') { dragState = {type:'move_body', id:${arr.id}, lastX: ${midX}, lastY: ${midY}}; } else if('${editAction}'==='rotate') { const cx=(${arr.x1}+${arr.x2})/2; const cy=(${arr.y1}+${arr.y2})/2; const c = getCoords(event); dragState = {type:'rotate', id:${arr.id}, cx, cy, lastAngle: Math.atan2(c.y - cy, c.x - cx)}; } }">
                            <input type="text" value="${arr.label}" 
                                   oninput="const found=arrows.find(a=>a.id===${arr.id}); if(found) found.label=this.value;"
                                   onpointerdown="event.stopPropagation(); selectedId = ${arr.id}; updateView();"
                                   class="text-center font-bold outline-none bg-transparent text-xs ${isSel ? 'text-orange-700' : 'text-sky-700'} ${mode==='preview'?'border-none':''}" 
                                   style="width: ${Math.max(arr.label.length, 1)}ch; min-width: 10px;" />
                            ${isSel ? `<button onpointerdown="event.stopPropagation(); arrows = arrows.filter(a => a.id !== ${arr.id}); selectedId = null; updateView();" class="absolute -top-9 -right-9 bg-red-500 hover:bg-red-600 text-white p-1.5 rounded-full shadow-md transition-transform hover:scale-110" title="Supprimer"><i class="fa-solid fa-trash text-xs"></i></button>` : ''}
                        </div>
                    </div>
                `;
            });
            htmlLayer.innerHTML = htmlContent;

            // Gestion de l'affichage de la barre d'outils secondaire
            const optPanel = document.getElementById('arrow-options');
            if (mode === 'select' && selectedId !== null) {
                optPanel.classList.remove('hidden');
                const activeArr = arrows.find(a => a.id === selectedId);
                if (activeArr) {
                    document.getElementById('range-size').value = activeArr.size || 1;
                    document.getElementById('range-text-size').value = activeArr.textSize || 1;
                }
            } else {
                optPanel.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
