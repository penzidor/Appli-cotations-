<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créateur de Fiche Technique & Cotes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background-color: #f1f5f9; }
        input[type="range"] { accent-color: #ea580c; cursor: pointer; }
    </style>
</head>
<body class="min-h-screen flex flex-col select-none overflow-hidden">

    <!-- Barre d'outils principale -->
    <header class="bg-white shadow-sm border-b border-slate-200 p-3 flex flex-wrap gap-3 items-center justify-between z-20 relative">
        <label class="flex items-center gap-2 px-3 py-2 bg-slate-900 text-white rounded cursor-pointer hover:bg-slate-800 transition shadow-sm text-sm font-medium">
            <i class="fa-solid fa-upload"></i>
            <span id="upload-label">Importer une image</span>
            <input type="file" id="file-input" accept="image/*" class="hidden">
        </label>

        <!-- Boutons de Mode (Tracer / Sélectionner) -->
        <div id="mode-buttons" class="hidden flex bg-slate-100 p-1 rounded-lg border border-slate-200 shadow-inner">
            <button id="btn-draw" onclick="switchMode('draw')" class="flex items-center gap-2 px-4 py-2 rounded-md transition font-bold text-sm bg-blue-600 text-white shadow">
                <i class="fa-solid fa-pencil"></i> Tracer
            </button>
            <button id="btn-select" onclick="switchMode('select')" class="flex items-center gap-2 px-4 py-2 rounded-md transition font-bold text-sm text-slate-600 hover:bg-slate-200">
                <i class="fa-solid fa-mouse-pointer"></i> Sélectionner / Déplacer
            </button>
        </div>

        <!-- Commandes de Zoom & Aperçu -->
        <div id="top-right-controls" class="hidden flex items-center gap-3">
            <div class="flex items-center bg-slate-100 rounded-lg border border-slate-200 shadow-inner text-slate-700 text-xs font-bold">
                <button onclick="changeZoom(-0.25)" class="px-3 py-2 hover:bg-slate-200 rounded-l-lg transition" title="Dézoomer"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                <span id="zoom-display" class="w-12 text-center select-none">100%</span>
                <button onclick="changeZoom(0.25)" class="px-3 py-2 hover:bg-slate-200 rounded-r-lg transition" title="Zoomer"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
            </div>
            <button onclick="togglePreview()" id="btn-preview" class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-bold transition shadow-sm bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100">
                <i class="fa-solid fa-camera"></i> Rendu Final
            </button>
        </div>
    </header>

    <!-- Barre d'options avancées (visible lorsqu'une flèche est sélectionnée) -->
    <div id="arrow-toolbar" class="hidden bg-slate-800 text-white p-2.5 flex flex-wrap justify-center items-center gap-3 z-30 relative shadow-lg">
        <span class="text-slate-300 text-xs font-semibold uppercase tracking-wider mr-1">Outils :</span>
        <button onclick="setAction('move')" id="act-move" class="flex items-center gap-1.5 px-3 py-1.5 rounded text-xs font-medium bg-orange-600 text-white shadow"><i class="fa-solid fa-hand"></i> Déplacer</button>
        <button onclick="setAction('resize')" id="act-resize" class="flex items-center gap-1.5 px-3 py-1.5 rounded text-xs font-medium bg-slate-700 hover:bg-slate-600"><i class="fa-solid fa-expand"></i> Taille flèche</button>
        <button onclick="setAction('rotate')" id="act-rotate" class="flex items-center gap-1.5 px-3 py-1.5 rounded text-xs font-medium bg-slate-700 hover:bg-slate-600"><i class="fa-solid fa-rotate"></i> Pivoter</button>
        
        <div class="w-px h-5 bg-slate-600 mx-1"></div>

        <!-- Curseur Taille Flèche -->
        <div class="flex items-center gap-2 bg-slate-700/80 px-2.5 py-1 rounded">
            <span class="text-slate-300 text-xs">Flèche :</span>
            <input type="range" id="slider-arrow-size" min="0.2" max="3" step="0.1" value="1" oninput="updateArrowSize(this.value)" class="w-16">
        </div>

        <!-- Curseur Taille Texte (Indépendant) -->
        <div class="flex items-center gap-2 bg-slate-700/80 px-2.5 py-1 rounded">
            <span class="text-slate-300 text-xs"><i class="fa-solid fa-font"></i> Texte :</span>
            <input type="range" id="slider-text-size" min="0.5" max="3" step="0.1" value="1" oninput="updateTextSize(this.value)" class="w-16">
        </div>

        <div class="w-px h-5 bg-slate-600 mx-1"></div>
        <button onclick="snapLine('horiz')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs transition">Horiz.</button>
        <button onclick="snapLine('vert')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs transition">Vertic.</button>
    </div>

    <!-- Zone principale d'affichage de l'image -->
    <main id="workspace" class="flex-1 overflow-auto bg-slate-200 p-6 flex justify-center items-start relative">
        <!-- Message d'accueil -->
        <div id="welcome-box" class="mt-24 text-center flex flex-col items-center">
            <div class="w-20 h-20 bg-white shadow-md rounded-full flex items-center justify-center text-slate-400 mb-4">
                <i class="fa-solid fa-image text-3xl"></i>
            </div>
            <h2 class="text-lg font-bold text-slate-700 mb-1">Aucune image chargée</h2>
            <p class="text-sm text-slate-500 max-w-sm">Cliquez sur "Importer une image" en haut pour commencer à poser vos cotes.</p>
        </div>

        <!-- Conteneur de l'image et calques -->
        <div id="canvas-wrapper" class="hidden relative shadow-2xl bg-white origin-top-left transition-transform duration-75">
            <img id="source-image" class="block max-w-[85vw] md:max-w-[70vw] object-contain pointer-events-none" alt="Fiche technique">
            
            <!-- Calque SVG (Lignes de cotes et pointes) -->
            <svg id="svg-layer" class="absolute top-0 left-0 w-full h-full overflow-visible pointer-events-none">
                <defs>
                    <marker id="arr-start" orient="auto" markerWidth="6" markerHeight="6" refX="0.5" refY="3">
                        <path d="M 6 0 L 0 3 L 6 6 Z" fill="#0284c7" />
                    </marker>
                    <marker id="arr-end" orient="auto" markerWidth="6" markerHeight="6" refX="5.5" refY="3">
                        <path d="M 0 0 L 6 3 L 0 6 Z" fill="#0284c7" />
                    </marker>
                    <marker id="arr-start-sel" orient="auto" markerWidth="6" markerHeight="6" refX="0.5" refY="3">
                        <path d="M 6 0 L 0 3 L 6 6 Z" fill="#ea580c" />
                    </marker>
                    <marker id="arr-end-sel" orient="auto" markerWidth="6" markerHeight="6" refX="5.5" refY="3">
                        <path d="M 0 0 L 6 3 L 0 6 Z" fill="#ea580c" />
                    </marker>
                </defs>
            </svg>

            <!-- Calque HTML (Inputs de texte interactifs) -->
            <div id="html-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none"></div>
        </div>
    </main>

    <!-- Script JavaScript Natif Ultra-Fiable -->
    <script>
        let imgLoaded = false;
        let arrows = [];
        let mode = 'draw'; // 'draw' | 'select' | 'preview'
        let selectedId = null;
        let activeAction = 'move'; // 'move' | 'resize' | 'rotate'
        let zoomScale = 1;
        let interactionState = null;

        const workspace = document.getElementById('workspace');
        const wrapper = document.getElementById('canvas-wrapper');
        const imgElement = document.getElementById('source-image');
        const svgLayer = document.getElementById('svg-layer');
        const htmlLayer = document.getElementById('html-layer');

        // Gestion de l'upload d'image
        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                imgElement.src = URL.createObjectURL(file);
                imgElement.onload = () => {
                    imgLoaded = true;
                    document.getElementById('welcome-box').classList.add('hidden');
                    wrapper.classList.remove('hidden');
                    document.getElementById('mode-buttons').classList.remove('hidden');
                    document.getElementById('top-right-controls').classList.remove('hidden');
                    document.getElementById('upload-label').innerText = 'Changer l\'image';
                    arrows = [];
                    selectedId = null;
                    zoomScale = 1;
                    render();
                };
            }
        });

        function switchMode(newMode) {
            mode = newMode;
            selectedId = null;
            document.getElementById('btn-draw').className = mode === 'draw' ? 'flex items-center gap-2 px-4 py-2 rounded-md transition font-bold text-sm bg-blue-600 text-white shadow' : 'flex items-center gap-2 px-4 py-2 rounded-md transition font-bold text-sm text-slate-600 hover:bg-slate-200';
            document.getElementById('btn-select').className = mode === 'select' ? 'flex items-center gap-2 px-4 py-2 rounded-md transition font-bold text-sm bg-blue-600 text-white shadow' : 'flex items-center gap-2 px-4 py-2 rounded-md transition font-bold text-sm text-slate-600 hover:bg-slate-200';
            wrapper.style.cursor = mode === 'draw' ? 'crosshair' : 'default';
            render();
        }

        function setAction(act) {
            activeAction = act;
            ['move', 'resize', 'rotate'].forEach(a => {
                const btn = document.getElementById(`act-${a}`);
                btn.className = a === act ? 'flex items-center gap-1.5 px-3 py-1.5 rounded text-xs font-medium bg-orange-600 text-white shadow' : 'flex items-center gap-1.5 px-3 py-1.5 rounded text-xs font-medium bg-slate-700 hover:bg-slate-600';
            });
            render();
        }

        function changeZoom(delta) {
            zoomScale = Math.min(Math.max(zoomScale + delta, 0.25), 4);
            document.getElementById('zoom-display').innerText = Math.round(zoomScale * 100) + '%';
            render();
        }

        function togglePreview() {
            if (mode === 'preview') {
                mode = 'select';
                document.getElementById('btn-preview').className = "flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-bold transition shadow-sm bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100";
            } else {
                mode = 'preview';
                selectedId = null;
                document.getElementById('btn-preview').className = "flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-bold transition shadow-sm bg-emerald-600 text-white";
            }
            render();
        }

        function getMousePos(e) {
            const rect = imgElement.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) / zoomScale,
                y: (e.clientY - rect.top) / zoomScale
            };
        }

        // --- GESTION DES INTERACTIONS (Souris / Tactile) ---
        wrapper.addEventListener('pointerdown', (e) => {
            if (!imgLoaded || mode === 'preview') return;
            const pos = getMousePos(e);

            if (mode === 'draw') {
                interactionState = { type: 'draw', x1: pos.x, y1: pos.y, x2: pos.x, y2: pos.y };
                selectedId = null;
            } else if (mode === 'select' && e.target === imgElement) {
                selectedId = null;
                render();
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (!interactionState) return;
            const pos = getMousePos(e);

            if (interactionState.type === 'draw') {
                interactionState.x2 = pos.x;
                interactionState.y2 = pos.y;
                render();
            } else if (interactionState.type === 'move') {
                const arr = arrows.find(a => a.id === interactionState.id);
                if (arr) {
                    const dx = pos.x - interactionState.lastX;
                    const dy = pos.y - interactionState.lastY;
                    arr.x1 += dx; arr.y1 += dy;
                    arr.x2 += dx; arr.y2 += dy;
                    interactionState.lastX = pos.x; interactionState.lastY = pos.y;
                    render();
                }
            } else if (interactionState.type === 'resize') {
                const arr = arrows.find(a => a.id === interactionState.id);
                if (arr) {
                    if (interactionState.which === 'start') { arr.x1 = pos.x; arr.y1 = pos.y; }
                    else { arr.x2 = pos.x; arr.y2 = pos.y; }
                    render();
                }
            } else if (interactionState.type === 'rotate') {
                const arr = arrows.find(a => a.id === interactionState.id);
                if (arr) {
                    const cx = (arr.x1 + arr.x2) / 2;
                    const cy = (arr.y1 + arr.y2) / 2;
                    const curAngle = Math.atan2(pos.y - cy, pos.x - cx);
                    const delta = curAngle - interactionState.lastAngle;
                    const cos = Math.cos(delta), sin = Math.sin(delta);
                    
                    const nx1 = cx + (arr.x1 - cx) * cos - (arr.y1 - cy) * sin;
                    const ny1 = cy + (arr.x1 - cx) * sin + (arr.y1 - cy) * cos;
                    const nx2 = cx + (arr.x2 - cx) * cos - (arr.y2 - cy) * sin;
                    const ny2 = cy + (arr.x2 - cx) * sin + (arr.y2 - cy) * cos;
                    
                    arr.x1 = nx1; arr.y1 = ny1; arr.x2 = nx2; arr.y2 = ny2;
                    interactionState.lastAngle = curAngle;
                    render();
                }
            }
        });

        window.addEventListener('pointerup', () => {
            if (!interactionState) return;
            if (interactionState.type === 'draw') {
                const length = Math.hypot(interactionState.x2 - interactionState.x1, interactionState.y2 - interactionState.y1);
                if (length > 5) {
                    const newArr = { id: Date.now(), x1: interactionState.x1, y1: interactionState.y1, x2: interactionState.x2, y2: interactionState.y2, label: 'A', size: 1, textSize: 1 };
                    arrows.push(newArr);
                    selectedId = newArr.id;
                    switchMode('select');
                    setAction('move');
                }
            }
            interactionState = null;
            render();
        });

        function updateArrowSize(val) {
            const arr = arrows.find(a => a.id === selectedId);
            if (arr) { arr.size = parseFloat(val); render(); }
        }

        function updateTextSize(val) {
            const arr = arrows.find(a => a.id === selectedId);
            if (arr) { arr.textSize = parseFloat(val); render(); }
        }

        function snapLine(type) {
            const arr = arrows.find(a => a.id === selectedId);
            if (!arr) return;
            const cx = (arr.x1 + arr.x2) / 2;
            const cy = (arr.y1 + arr.y2) / 2;
            const len = Math.hypot(arr.x2 - arr.x1, arr.y2 - arr.y1);
            if (type === 'horiz') {
                arr.x1 = cx - len/2; arr.y1 = cy; arr.x2 = cx + len/2; arr.y2 = cy;
            } else {
                arr.x1 = cx; arr.y1 = cy - len/2; arr.x2 = cx; arr.y2 = cy + len/2;
            }
            render();
        }

        // Moteur de rendu graphique synchronisé
        function render() {
            wrapper.style.transform = `scale(${zoomScale})`;

            // Dessin SVG
            let svgContent = svgLayer.querySelector('defs').outerHTML;
            arrows.forEach(arr => {
                const isSel = (arr.id === selectedId && mode !== 'preview');
                const strokeColor = isSel ? '#ea580c' : '#0284c7';
                const markerSuffix = isSel ? '-sel' : '';
                const strokeW = (isSel ? 1.5 : 1) * (arr.size || 1);

                svgContent += `<line x1="${arr.x1}" y1="${arr.y1}" x2="${arr.x2}" y2="${arr.y2}" stroke="${strokeColor}" stroke-width="${strokeW}" marker-start="url(#arr-start${markerSuffix})" marker-end="url(#arr-end${markerSuffix})" />`;
                
                // Poignées de redimensionnement si mode resize actif
                if (isSel && activeAction === 'resize') {
                    svgContent += `<circle cx="${arr.x1}" cy="${arr.y1}" r="6" fill="white" stroke="#ea580c" stroke-width="2" />`;
                    svgContent += `<circle cx="${arr.x2}" cy="${arr.y2}" r="6" fill="white" stroke="#ea580c" stroke-width="2" />`;
                }
            });

            if (interactionState && interactionState.type === 'draw') {
                svgContent += `<line x1="${interactionState.x1}" y1="${interactionState.y1}" x2="${interactionState.x2}" y2="${interactionState.y2}" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4" marker-start="url(#arr-start)" marker-end="url(#arr-end)" />`;
            }
            svgLayer.innerHTML = svgContent;

            // Rendu HTML des intitulés et zone de sélection
            let htmlContent = '';
            arrows.forEach(arr => {
                const isSel = (arr.id === selectedId && mode !== 'preview');
                const midX = (arr.x1 + arr.x2) / 2;
                const midY = (arr.y1 + arr.y2) / 2;
                const textScale = arr.textSize || 1;

                htmlContent += `
                    <div style="position: absolute; left: ${midX}px; top: ${midY}px; transform: translate(-50%, -50%) scale(${textScale}); pointer-events: auto;">
                        <div class="relative flex items-center px-1.5 py-0.5 rounded shadow-sm ${isSel ? 'ring-2 ring-orange-500 bg-white' : 'bg-white/90 hover:bg-white'} transition-all"
                             style="cursor: ${isSel && activeAction !== 'move' ? 'default' : 'move'};"
                             onpointerdown="event.stopPropagation(); selectedId = ${arr.id}; if('${mode}'==='select') { activeAction='move'; setAction('move'); interactionState = {type:'move', id:${arr.id}, lastX:${midX}, lastY:${midY}}; }">
                            
                            <input type="text" value="${arr.label}" 
                                   oninput="const found=arrows.find(a=>a.id===${arr.id}); if(found) found.label=this.value;"
                                   onpointerdown="event.stopPropagation(); selectedId = ${arr.id};"
                                   class="text-center font-bold outline-none bg-transparent text-xs ${isSel ? 'text-orange-700' : 'text-sky-700'} ${mode==='preview'?'border-none':''}" 
                                   style="width: ${Math.max(arr.label.length, 1)}ch; min-width: 15px;" />
                            
                            ${isSel ? `<button onpointerdown="event.stopPropagation(); arrows = arrows.filter(a => a.id !== ${arr.id}); selectedId = null; render();" class="absolute -top-8 -right-8 bg-red-500 hover:bg-red-600 text-white p-1 rounded-full shadow-md transition transform hover:scale-110" title="Supprimer"><i class="fa-solid fa-trash text-[10px]"></i></button>` : ''}
                        </div>
                    </div>
                `;
            });
            htmlLayer.innerHTML = htmlContent;

            // Affichage conditionnel de la barre d'outils secondaire
            const toolbar = document.getElementById('arrow-toolbar');
            if (mode === 'select' && selectedId !== null) {
                toolbar.classList.remove('hidden');
                const target = arrows.find(a => a.id === selectedId);
                if (target) {
                    document.getElementById('slider-arrow-size').value = target.size || 1;
                    document.getElementById('slider-text-size').value = target.textSize || 1;
                }
            } else {
                toolbar.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
